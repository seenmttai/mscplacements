<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.08"/>
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circles -->
  <circle cx="300" cy="250" r="210" fill="url(#bgGrad)"/>
  <circle cx="480" cy="120" r="90" fill="#2563EB" fill-opacity="0.03"/>
  <circle cx="120" cy="380" r="100" fill="#0EA5E9" fill-opacity="0.03"/>

  <!-- Background Hexagon Accents -->
  <path d="M 500 220 L 535 240 L 535 280 L 500 300 L 465 280 L 465 240 Z" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="4 4"/>
  <path d="M 100 140 L 130 157 L 130 192 L 100 209 L 70 192 L 70 157 Z" fill="none" stroke="#0EA5E9" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Connecting Vector Flow Lines -->
  <path d="M 140 250 Q 240 180 300 240 T 460 250" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-dasharray="6 6"/>
  <circle cx="210" cy="215" r="4" fill="#2563EB" filter="url(#glow)"/>
  <circle cx="390" cy="265" r="4" fill="#0EA5E9" filter="url(#glow)"/>

  <!-- Main Candidate Profile Glass Card -->
  <g filter="url(#shadow)" transform="translate(130, 110)">
    <rect width="340" height="260" rx="16" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Top Header Bar inside Card -->
    <rect width="340" height="52" rx="16" fill="#0F172A"/>
    <!-- Correct bottom corner radius for header line -->
    <rect y="36" width="340" height="16" fill="#0F172A"/>

    <!-- Header Status & Title -->
    <circle cx="28" cy="26" r="6" fill="#10B981"/>
    <text x="44" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Pre-Screened CA Candidate Profile</text>
    <rect x="235" y="16" width="85" height="20" rx="10" fill="#1E293B"/>
    <text x="277" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#38BDF8" text-anchor="middle">VERIFIED</text>

    <!-- Candidate Avatar & Info -->
    <circle cx="50" cy="95" r="24" fill="url(#primaryGrad)"/>
    <path d="M 50 83 C 44 83 40 87 40 93 C 40 96 42 98 45 99 C 41 101 37 104 37 109 L 63 109 C 63 104 59 101 55 99 C 58 98 60 96 60 93 C 60 87 56 83 50 83 Z" fill="#FFFFFF"/>
    
    <text x="88" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">CA Industrial Trainee</text>
    <text x="88" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Available for 9–12 Months · Finalist</text>

    <!-- Divider -->
    <line x1="24" y1="132" x2="316" y2="132" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Key Competency Tags -->
    <text x="24" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569" letter-spacing="0.5">SCREENED DOMAIN READINESS</text>
    
    <!-- Tag 1 -->
    <rect x="24" y="168" width="92" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="70" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">Taxation (Direct)</text>

    <!-- Tag 2 -->
    <rect x="124" y="168" width="62" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="155" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">FP&amp;A</text>

    <!-- Tag 3 -->
    <rect x="194" y="168" width="102" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="245" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">Internal Audit</text>

    <!-- Bottom Metrics Strip inside card -->
    <rect x="24" y="208" width="292" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Metric 1 -->
    <circle cx="42" cy="226" r="8" fill="#10B981"/>
    <path d="M 38 226 L 41 229 L 46 223" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155">MSC Verified Pool</text>

    <!-- Metric 2 -->
    <text x="210" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#2563EB">⚡ 24h Turnaround</text>
  </g>

  <!-- Floating Badge 1: 1,100+ Placed (Top Left) -->
  <g filter="url(#shadow)" transform="translate(60, 60)">
    <rect width="160" height="54" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="12" y="12" width="30" height="30" rx="8" fill="#EFF6FF"/>
    <path d="M 27 20 L 21 26 L 17 22" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#0F172A">1,100+</text>
    <text x="50" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748B">Students Placed</text>
  </g>

  <!-- Floating Badge 2: Zero Employer Cost (Bottom Right) -->
  <g filter="url(#shadow)" transform="translate(380, 350)">
    <rect width="170" height="54" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="12" y="12" width="30" height="30" rx="8" fill="#ECFDF5"/>
    <text x="27" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#10B981" text-anchor="middle">₹0</text>
    <text x="50" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">No Employer Fee</text>
    <text x="50" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748B">100% Free Placement</text>
  </g>

  <!-- Floating Badge 3: 200+ Monthly Trained (Bottom Left) -->
  <g filter="url(#shadow)" transform="translate(40, 330)">
    <rect width="160" height="50" rx="10" fill="#0F172A"/>
    <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38BDF8">200+ Trained / Mo</text>
    <text x="20" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94A3B8">Active Talent Pipeline</text>
  </g>
</svg>
